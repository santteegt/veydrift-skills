[project]
name = "veydrift-agent"
version = "1.2.0"
description = "Read, analyse and plan Veydrift planet management. Builds onchain actions; never signs them."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "pydantic>=2.10",
    "rich>=13.9",
    "tenacity>=9.0",
]

[project.scripts]
vd = "veydrift_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veydrift_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
